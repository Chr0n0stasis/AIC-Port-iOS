name: Build Alice in Cradle iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      private_audio:
        description: Build with CRI audio and send the IPA to the private release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Unsigned iOS IPA (Release)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      AIC_TEXTURE_OVERLAY: /tmp/aic_ios_build/texture-overlay

    steps:
      - name: Checkout repository
        if: inputs.private_audio != true
        uses: actions/checkout@v4

      - name: Checkout build sources
        if: inputs.private_audio == true
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /native/
            /resources/
            /scripts/
            /src/
            /tools/
            /ConvertedData/StreamingAssets/_debug.txt

      - name: Set up .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python for texture conversion
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download private build inputs
        if: inputs.private_audio == true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AIC_PRIVATE_ASSETS_TOKEN }}
          ASSETS_REPO: ${{ vars.AIC_PRIVATE_ASSETS_REPO }}
        run: |
          test -n "$ASSETS_REPO" && test -n "$GH_TOKEN" || {
            echo '::error::Configure AIC_PRIVATE_ASSETS_REPO and AIC_PRIVATE_ASSETS_TOKEN.'
            exit 1
          }
          if [[ "$(gh api "repos/$ASSETS_REPO" --jq .private)" != true ]]; then
            echo '::error::The build inputs repository must be private.'
            exit 1
          fi
          gh release view ios-test-builds --repo "$ASSETS_REPO" >/dev/null
          sdk_name=criadx2le_sdk_unity_v3_14_00_01_smartphone_j.zip
          inputs_name=aic-game-inputs-0.30i.tar.gz
          inputs_dir=$(mktemp -d "$RUNNER_TEMP/aic-inputs.XXXXXX")
          gh release download ios-inputs-0.30i --repo "$ASSETS_REPO" --dir "$inputs_dir" \
            --pattern "$sdk_name" --pattern "$inputs_name"
          test -s "$inputs_dir/$sdk_name"
          tar --exclude 'ConvertedData/StreamingAssets/_debug.txt' -xzf "$inputs_dir/$inputs_name"
          test -f PatchedManaged/Assembly-CSharp.dll
          test -f ConvertedData/globalgamemanagers
          test -f ConvertedData/StreamingAssets/_debug.txt
          printf 'AIC_CRI_SDK_ZIP=%s\n' "$inputs_dir/$sdk_name" >> "$GITHUB_ENV"

      - name: Cache converted iOS textures
        if: inputs.private_audio != true
        uses: actions/cache@v4
        with:
          path: ${{ env.AIC_TEXTURE_OVERLAY }}
          key: aic-ios-textures-${{ runner.arch }}-${{ hashFiles('ConvertedData/StreamingAssets/**/*.dat', 'tools/convert_assets.py', 'tools/requirements-ios-textures.txt') }}

      - name: Restore private ASTC texture cache
        if: inputs.private_audio == true
        id: private-textures
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AIC_PRIVATE_ASSETS_TOKEN }}
          ASSETS_REPO: ${{ vars.AIC_PRIVATE_ASSETS_REPO }}
          TEXTURE_INPUT_HASH: ${{ hashFiles('ConvertedData/StreamingAssets/**/*.dat', 'tools/convert_assets.py', 'tools/requirements-ios-textures.txt') }}
        run: |
          test -n "$TEXTURE_INPUT_HASH"
          archive="astc-textures-${RUNNER_ARCH}-${TEXTURE_INPUT_HASH}.tar"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          cache_dir=$(mktemp -d "$RUNNER_TEMP/aic-textures.XXXXXX")
          if gh release download ios-inputs-0.30i --repo "$ASSETS_REPO" --dir "$cache_dir" --pattern "$archive"; then
            mkdir -p "$cache_dir/overlay"
            if tar -xf "$cache_dir/$archive" -C "$cache_dir/overlay" && [[ -f "$cache_dir/overlay/.complete" ]]; then
              mkdir -p "$(dirname "$AIC_TEXTURE_OVERLAY")"
              mv "$cache_dir/overlay" "$AIC_TEXTURE_OVERLAY"
              printf 'hit=true\n' >> "$GITHUB_OUTPUT"
              echo '[+] Reusing private ASTC textures.'
            else
              echo '::warning::The private ASTC cache could not be restored.'
            fi
            rm -f -- "$cache_dir/$archive"
          else
            echo '[*] Private ASTC cache unavailable. The build will convert the textures.'
          fi

      - name: Cache Unity iOS Playback Engine
        uses: actions/cache@v4
        id: cache-playback-engine
        with:
          path: /tmp/aic_ios_build/playback_engine
          key: unity-ios-engine-2022.3.62f2-7670c08855a9

      - name: Configure IL2CPP compiler cache
        id: compiler-cache
        shell: bash
        run: |
          if ! command -v ccache >/dev/null && ! HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache; then
            echo "::warning::ccache is unavailable; using uncached compilation."
            exit 0
          fi

          clang=$(xcrun --sdk iphoneos --find clang)
          clangxx=$(xcrun --sdk iphoneos --find clang++)
          toolchain=$(
            { xcodebuild -version
              xcrun --sdk iphoneos --show-sdk-build-version
              shasum -a 256 "$clang" "$clangxx"
            } | shasum -a 256 | cut -d ' ' -f 1
          )
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          {
            echo "AIC_USE_CCACHE=1"
            echo "CCACHE_DIR=/tmp/aic_ios_build/ccache"
            echo "CCACHE_MAXSIZE=1G"
            echo "CCACHE_COMPILERCHECK=string:$toolchain"
          } >> "$GITHUB_ENV"

      - name: Cache generated IL2CPP object files
        if: inputs.private_audio != true && steps.compiler-cache.outputs.toolchain != ''
        uses: actions/cache@v4
        with:
          path: /tmp/aic_ios_build/ccache
          key: aic-il2cpp-ccache-v1-${{ runner.arch }}-${{ steps.compiler-cache.outputs.toolchain }}-${{ hashFiles('PatchedManaged/**', 'tools/AssemblyPatcher/*.cs', 'tools/AssemblyPatcher/*.csproj', 'src/*.cs', 'src/*.csproj', 'scripts/build-ios.sh') }}
          restore-keys: aic-il2cpp-ccache-v1-${{ runner.arch }}-${{ steps.compiler-cache.outputs.toolchain }}-

      - name: Restore private IL2CPP compiler cache
        if: inputs.private_audio == true && steps.compiler-cache.outputs.toolchain != ''
        id: private-compiler-cache
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AIC_PRIVATE_ASSETS_TOKEN }}
          ASSETS_REPO: ${{ vars.AIC_PRIVATE_ASSETS_REPO }}
          TOOLCHAIN: ${{ steps.compiler-cache.outputs.toolchain }}
          INPUT_HASH: ${{ hashFiles('PatchedManaged/**', 'tools/AssemblyPatcher/*.cs', 'tools/AssemblyPatcher/*.csproj', 'src/*.cs', 'src/*.csproj', 'scripts/build-ios.sh', 'scripts/stage-cri-ios-sdk.py') }}
        run: |
          prefix="il2cpp-ccache-v1-${RUNNER_ARCH}-${TOOLCHAIN}-"
          sdk_hash=$(shasum -a 256 "$AIC_CRI_SDK_ZIP" | cut -d ' ' -f 1)
          key=$(printf '%s\n' "$INPUT_HASH" "$sdk_hash" | shasum -a 256 | cut -d ' ' -f 1)
          archive="${prefix}${key}.tar"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

          if ! assets=$(gh release view ios-inputs-0.30i --repo "$ASSETS_REPO" --json assets); then
            echo '::warning::Could not list the private compiler caches.'
            exit 0
          fi
          candidate=$(jq -r --arg key "$archive" --arg prefix "$prefix" '
            [.assets[] | select(.state == "uploaded" and (.name | startswith($prefix)))] as $caches
            | ($caches | map(select(.name == $key)) | first)
              // ($caches | sort_by(.createdAt) | last)
              | .name // empty' <<< "$assets")
          if [[ -z "$candidate" ]]; then
            echo '[*] No private compiler cache for this toolchain.'
            exit 0
          fi

          cache_dir=$(mktemp -d "$RUNNER_TEMP/aic-ccache.XXXXXX")
          mkdir -p "$cache_dir/ccache"
          if gh release download ios-inputs-0.30i --repo "$ASSETS_REPO" --dir "$cache_dir" --pattern "$candidate" &&
              tar -xf "$cache_dir/$candidate" -C "$cache_dir/ccache"; then
            mkdir -p "$(dirname "$CCACHE_DIR")"
            mv "$cache_dir/ccache" "$CCACHE_DIR"
            if [[ "$archive" == "$candidate" ]]; then
              printf 'hit=true\n' >> "$GITHUB_OUTPUT"
            fi
            echo '[+] Restored private compiler cache. See ccache statistics for object hits.'
          else
            echo '::warning::Could not restore the private compiler cache.'
          fi
          rm -f -- "$cache_dir/$candidate"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Execute iOS Port Build Pipeline
        id: build
        run: bash scripts/build-ios.sh

      - name: Generate member-level IPA patch
        id: ipa-patch
        if: inputs.private_audio == true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AIC_PRIVATE_ASSETS_TOKEN }}
          ASSETS_REPO: ${{ vars.AIC_PRIVATE_ASSETS_REPO }}
          TARGET_IPA: ${{ steps.build.outputs.ipa_path }}
        run: |
          base_name="$(gh release view ios-test-builds --repo "$ASSETS_REPO" --json assets \
            --jq '[.assets[] | select(.name | endswith("_Unsigned.ipa"))] | sort_by(.createdAt) | reverse | .[0].name')"
          if [[ -z "$base_name" || "$base_name" == null ]]; then
            echo "No previous unsigned IPA; skipping patch."
            exit 0
          fi
          patch_dir="$RUNNER_TEMP/ipa-member-patch"
          mkdir -p "$patch_dir"
          gh release download ios-test-builds --repo "$ASSETS_REPO" --pattern "$base_name" --dir "$patch_dir"
          base_path="$patch_dir/$base_name"
          target_name="$(basename "$TARGET_IPA" .ipa)"
          base_version="${base_name%_Unsigned.ipa}"
          patch_path="$patch_dir/${target_name}.from_${base_version}.aicpatch"
          python3 tools/ipa_member_patch.py create --base "$base_path" --target "$TARGET_IPA" --output "$patch_path"
          printf 'patch_path=%s\n' "$patch_path" >> "$GITHUB_OUTPUT"
          printf 'base_name=%s\n' "$base_name" >> "$GITHUB_OUTPUT"

      - name: Upload iOS IPA Artifact
        if: inputs.private_audio != true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ steps.build.outputs.ipa_path }}
          if-no-files-found: error

      - name: Upload IPA to the private release
        if: inputs.private_audio == true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AIC_PRIVATE_ASSETS_TOKEN }}
          ASSETS_REPO: ${{ vars.AIC_PRIVATE_ASSETS_REPO }}
          IPA_PATH: ${{ steps.build.outputs.ipa_path }}
          PATCH_PATH: ${{ steps.ipa-patch.outputs.patch_path }}
        run: |
          if [[ "$(gh api "repos/$ASSETS_REPO" --jq .private)" != true ]]; then
            echo '::error::The IPA destination repository must be private.'
            exit 1
          fi
          gh release upload ios-test-builds "$IPA_PATH" --repo "$ASSETS_REPO"
          if [[ -n "$PATCH_PATH" && -f "$PATCH_PATH" ]]; then
            gh release upload ios-test-builds "$PATCH_PATH" --repo "$ASSETS_REPO"
          fi

      - name: Upload member-level IPA patch artifact
        if: ${{ inputs.private_audio != true && steps.ipa-patch.outputs.patch_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}_patch
          path: ${{ steps.ipa-patch.outputs.patch_path }}
          if-no-files-found: error

      - name: Save private ASTC texture cache
        if: ${{ !cancelled() && inputs.private_audio == true && steps.private-textures.outputs.archive != '' && steps.private-textures.outputs.hit != 'true' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AIC_PRIVATE_ASSETS_TOKEN }}
          ASSETS_REPO: ${{ vars.AIC_PRIVATE_ASSETS_REPO }}
          CACHE_ARCHIVE: ${{ steps.private-textures.outputs.archive }}
        run: |
          [[ -f "$AIC_TEXTURE_OVERLAY/.complete" ]] || exit 0
          if [[ "$(gh api "repos/$ASSETS_REPO" --jq .private)" != true ]]; then
            echo '::warning::The texture cache destination must be private.'
            exit 1
          fi
          cache_dir=$(mktemp -d "$RUNNER_TEMP/aic-textures.XXXXXX")
          tar -cf "$cache_dir/$CACHE_ARCHIVE" -C "$AIC_TEXTURE_OVERLAY" .
          gh release upload ios-inputs-0.30i "$cache_dir/$CACHE_ARCHIVE" --repo "$ASSETS_REPO"

      - name: Save private IL2CPP compiler cache
        if: ${{ !cancelled() && inputs.private_audio == true && steps.build.outputs.ccache_ready == 'true' && steps.private-compiler-cache.outputs.archive != '' && steps.private-compiler-cache.outputs.hit != 'true' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AIC_PRIVATE_ASSETS_TOKEN }}
          ASSETS_REPO: ${{ vars.AIC_PRIVATE_ASSETS_REPO }}
          CACHE_ARCHIVE: ${{ steps.private-compiler-cache.outputs.archive }}
        run: |
          if [[ "$(gh api "repos/$ASSETS_REPO" --jq .private)" != true ]]; then
            echo '::warning::The compiler cache destination must be private.'
            exit 1
          fi
          ccache --cleanup
          cache_dir=$(mktemp -d "$RUNNER_TEMP/aic-ccache.XXXXXX")
          tar -cf "$cache_dir/$CACHE_ARCHIVE" -C "$CCACHE_DIR" .
          gh release upload ios-inputs-0.30i "$cache_dir/$CACHE_ARCHIVE" --repo "$ASSETS_REPO"
