name: Unity iOS IL2CPP

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: Path to the Unity project in this repository
        default: UnityProbe
        required: true

permissions:
  contents: read

jobs:
  prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check project and license
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          project="$(realpath -m -- "$PROJECT_PATH")"
          case "$project/" in
            "$GITHUB_WORKSPACE/"*) ;;
            *) echo "::error::Choose a Unity project inside this repository"; exit 1 ;;
          esac
          ready=0
          if [[ ! -f "$project/ProjectSettings/ProjectVersion.txt" || ! -f "$project/Packages/manifest.json" ]]; then
            echo "::error::Supply a Unity project with ProjectSettings and Packages"
            ready=1
          fi
          if [[ -z "$UNITY_LICENSE" || -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error::Configure the Unity Personal license secrets for GameCI"
            ready=1
          fi
          exit "$ready"

  build:
    needs: prerequisites
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        if: inputs.project_path == 'UnityProbe'
        with:
          dotnet-version: '8.0.x'
      - name: Build the probe IL plugin
        if: inputs.project_path == 'UnityProbe'
        run: bash scripts/prepare-unity-probe.sh
      - name: Export Unity iOS project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ inputs.project_path }}
          targetPlatform: iOS
          buildMethod: ${{ inputs.project_path == 'UnityProbe' && 'PortProbeBuild.Export' || '' }}
          versioning: None
      - name: Build unsigned iOS app
        run: |
          project="$(find build/iOS -name Unity-iPhone.xcodeproj -type d -print -quit)"
          test -n "$project"
          bash scripts/build-xcode.sh "$project" "$RUNNER_TEMP/unity-ios-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: unity-ios-unsigned
          path: ${{ runner.temp }}/unity-ios-unsigned.zip
          if-no-files-found: error
